# Training recipe shared by all four arms (spec §5.3).
# Lines marked PILOT were chosen by the G3 pilot (BASE seed 0, id-val only):
#   lr 0.01 -> id-val mAP 24.5, lr 0.02 -> 25.9 (6000 iterations each); 1.19 it/s alone.
# FROZEN at G3 (2026-10-11); amended 2026-10-11 for a 5-hour total budget (prereg §7):
#   input short side 384-448 (eval 448), 4500 iterations, warmup 500; measured ~2.4 it/s.
frozen = true

batch_size = 8                 # PILOT
lr = 0.02                      # PILOT  SGD learning rate at batch_size
momentum = 0.9
weight_decay = 1e-4
iterations = 4500              # identical for every arm (~3.2 epochs, ~32 min)
warmup_iters = 500
lr_steps = [0.67, 0.89]        # PILOT  fractions of `iterations`; LR x0.1 at each
min_sizes = [384, 416, 448]   # scale jitter (short side); last = eval size
max_size = 798                 # 1280x720 at short side 448
hflip_p = 0.5
p_original = 0.5               # half-stylized arms: P(original image)
trainable_layers = 3
bf16 = true
num_workers = 8
log_every = 20
checkpoint_every = 500
